version: '3'

services:

  db:
    image: mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=treinamentodb
      - MYSQL_ROOT_PASSWORD=root
    container_name: db
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - spring-network

  app:
    depends_on:
      - db
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: on-failure
    container_name: app
    ports:
      - "8080:8080"

networks:
  spring-network:
    driver: bridge